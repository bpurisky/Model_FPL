# Render Blueprint for service/app.py (the Squad Optimizer backend).
# One option among several hosts that can run the Dockerfile at the repo
# root -- Fly.io and Railway would work the same way from the same image.
# Render was picked here for its free-tier web service with zero extra
# infra (no separate registry push step).
#
# Deploy: https://dashboard.render.com/blueprints -> New Blueprint
# Instance -> point at this repo. Render reads this file automatically.
# ALLOWED_ORIGINS is set to the real GitHub Pages origin below (a project
# site at bpurisky.github.io/Model_FPL/ still has origin bpurisky.github.io
# -- CORS matches on origin, not path). Add a second comma-separated value
# here (and redeploy) if a custom domain is ever added in front of Pages.
services:
  - type: web
    name: fpl-trends-optimizer
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: "https://bpurisky.github.io"
