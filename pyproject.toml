[project]
name = "fpl-trends"
version = "0.1.0"
description = "Fantasy Premier League analytics platform"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "duckdb>=1.1",
    "pyarrow>=18.0",
    "polars>=1.12",
    # Not in the superprompt's locked stack (§1.1); required to parse the
    # mandated config/*.yaml files (§1.2). See collector/config.py.
    "pyyaml>=6.0",
    # Not in the locked stack either; duckdb's Python DBAPI needs it to
    # convert TIMESTAMPTZ columns back to Python datetimes via fetchall()
    # (the .pl()/Arrow path doesn't need it, so this only bites ad-hoc
    # `duckdb.sql(...).fetchall()` querying of the distilled Parquet).
    "pytz>=2024.1",
    # Not in the locked stack either; Windows has no built-in IANA time zone
    # database, so stdlib zoneinfo (which polars uses for tz-aware datetime
    # columns) needs this backport to resolve "UTC" at all on this platform.
    "tzdata>=2024.1",
    # Locked stack (§1.1) offers pulp or ortools for the squad optimizer;
    # pulp chosen — pure-Python wheel with a bundled CBC binary, no extra
    # system/compiler dependency to install on top of uv sync.
    "pulp>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]
# Not in §1.1's locked stack, which has no HTTP framework -- that section
# locks the *client* to "no build step, no framework"; it says nothing
# about the solver. Needed because squad/optimize.py's ILP solve cannot
# run in the browser (frontend §5.1.1/§5.6: no API server, no runtime
# Python, no client-side inference) or be precomputed (it takes an
# arbitrary live entry ID as input). fastapi+uvicorn over hand-rolling on
# `http.server` because a public, unauthenticated endpoint needs its input
# validation and CORS handling to be audited code, not bespoke. See
# service/app.py and the 2026-09-02 fpl-trends-superprompt.md entry.
service = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
