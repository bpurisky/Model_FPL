name: papertrade

on:
  schedule:
    # Every two hours, NOT daily. `freeze` now only writes inside the six
    # hours before a deadline (papertrade/freeze.py:FREEZE_WINDOW_HOURS) —
    # a daily cron would hit a six-hour window only by luck, and deadlines
    # move around anyway (gw1-3 are Fri 17:30 UTC, gw4 is Sat 12:30). At
    # this cadence roughly three runs land inside every window, so one
    # failed or skipped run doesn't cost the gameweek.
    #
    # Safe to run this often: `freeze` no-ops both when the gw is already
    # frozen and when the window hasn't opened (see cmd_freeze), and
    # `record-actuals` auto-detects whichever finished gameweeks aren't
    # recorded yet, so nothing here depends on any single run happening.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: papertrade
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --locked
      # The freeze's difficulty table seeds Elo from last season's results
      # (squad/live.py:build_elo_final_for_current_teams), which it reads
      # from data/historical/raw/ -- a gitignored cache a fresh checkout
      # never has. Without this step every run *inside* a freeze window
      # crashed with FileNotFoundError on data/historical/raw/2025-26/
      # fixtures.csv, which cost gw3, gw4 and gw5 2026-27. Runs outside
      # the window exit before reaching that code, so the workflow still
      # looked green most of the time. Same cache key as web.yml, so the
      # two workflows share one download.
      - id: raw-cache
        uses: actions/cache@v4
        with:
          path: data/historical/raw
          key: historical-raw-${{ hashFiles('backtest/backfill.py') }}
      - if: steps.raw-cache.outputs.cache-hit != 'true'
        run: uv run python -m backtest.backfill
      # record-actuals BEFORE freeze, not after: squad/live.py:build_train_df
      # now trains on data/current_season/, and drops the latest gameweek
      # entirely if an earlier one is missing from that store. A gameweek
      # confirmed shortly before the next deadline would otherwise sit
      # unrecorded until the run *after* the freeze that needed it.
      - run: uv run python -m papertrade record-actuals
      - run: uv run python -m papertrade freeze
      # §6.3-6.5 made legible (§5.16 D14) -- runs after freeze so the export
      # sees this run's own freeze, and its own schedule (this workflow's,
      # not `web.export all`'s six-hourly one) is deliberate: see
      # web/export/__main__.py:cmd_papertrade's docstring.
      - run: uv run pytest tests/test_export_papertrade.py -q
      - run: uv run python -m web.export papertrade
      - name: Commit freezes, actuals, and paper trade results
        run: |
          git config user.name "fpl-trends-papertrade"
          git config user.email "actions@users.noreply.github.com"
          # data/current_season/ doesn't exist until the first gameweek is
          # recorded -- `git add` on a missing path fails the step (bash
          # runs with -e by default), so only add it if it's actually there.
          # (`[ -d x ] && cmd` alone would itself trip -e when the test is
          # false, hence the explicit if/fi rather than a one-liner.)
          if [ -d papertrade/freezes ]; then git add papertrade/freezes; fi
          if [ -d data/current_season ]; then git add data/current_season; fi
          if [ -f data/web/v1/papertrade.json ]; then git add data/web/v1/papertrade.json; fi
          git diff --staged --quiet || git commit -m "papertrade: weekly freeze/actuals $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
