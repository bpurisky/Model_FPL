name: web

# §5.12. The committed exports (§5.3.4) are what let a fresh clone render
# Correlation Lab, Comparison, Explorer, Model Board and Scorecard with no
# pipeline run — but only while they are current, and until now nothing
# regenerated them. `fixtures.json` already drifted once inside a single
# day as gameweek 1's matches were played and Elo moved with them.
on:
  # After the collector, not on a clock of its own: every input that moves
  # hourly (fixtures, prices, ownership) moves because the collector moved
  # it, so its completion is the real signal that there is anything new to
  # export.
  workflow_run:
    workflows: ["collect"]
    types: [completed]
  push:
    branches: [main]
    # Code changes that cannot change the numbers should not rebuild them.
    paths:
      - "web/export/**"
      - "analytics/**"
      - "backtest/**"
      - "config/frontend.yaml"
      - "data/historical/**"
      - ".github/workflows/web.yml"
  workflow_dispatch: {}

# §5.12 publishes to Pages, which needs these. `contents: write` is for
# the export commit; the other two are what `deploy-pages` requires.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: web
  cancel-in-progress: false

jobs:
  export:
    # A failed collector run has nothing new to say, and re-exporting on it
    # would republish the same numbers under a fresh timestamp.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --locked

      # The suite is the contract check. §5.12 wants the build to fail
      # loudly rather than degrade silently, and the export tests are what
      # catch a registry that no longer matches the panel or a schema.ts
      # that has drifted from contract.py — both of which would otherwise
      # publish a well-formed file the app reads wrongly.
      - run: uv run pytest tests/test_export_columns.py tests/test_export_contract.py tests/test_schema_ts.py -q

      # `analytics/evaluate.py:build_difficulty_table` (scorecard's live
      # walk-forward baseline) reads data/historical/raw/{season}/fixtures.csv
      # directly, not the committed data/historical/{season}.parquet -- and
      # that raw cache is gitignored (backtest/backfill.py's own docstring:
      # "nothing downstream depends on the raw cache surviving", which was
      # true when written and stopped being true once evaluate.py started
      # reading it). A fresh checkout has never had this directory, so this
      # job has failed on `web.export all` on every run since it was created
      # -- confirmed by reproducing the exact FileNotFoundError in a clean
      # worktree at data/historical/raw/2023-24/fixtures.csv. Re-running the
      # backfill here is exactly what the module was already designed for.
      - run: uv run python -m backtest.backfill

      - run: uv run python -m web.export all

      # panel.parquet and timeseries.parquet are build artifacts (§5.3.4).
      # Published for the routes that need them rather than committed —
      # they are gitignored, so the `git add` below cannot pick them up.
      - uses: actions/upload-artifact@v4
        with:
          name: web-parquet
          path: data/web/v1/*.parquet
          retention-days: 14

      - name: Commit the exports that changed
        run: |
          git config user.name "fpl-trends-web"
          git config user.email "actions@users.noreply.github.com"
          git add data/web/v1
          # `web.export` rewrites a file only when its numbers change
          # (see __main__.write_json), so a no-op run stages nothing and
          # this commits nothing rather than churning five files an hour.
          git diff --staged --quiet || git commit -m "web/export: refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

  # §5.12: "run the export, build, and publish to GitHub Pages."
  build:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # `ref: main` rather than the triggering sha: the export job may
      # have just committed refreshed numbers, and publishing the build
      # from before them would deploy a site a commit behind its own data.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      - run: npm ci
        working-directory: web/app

      # §5.12: "The build fails loudly on contract version mismatch
      # between committed data and the app's expected version. No silent
      # degradation." The app validates this at runtime too (load.ts), but
      # a site that only reports the mismatch once a reader opens it has
      # already shipped the mismatch.
      - name: Check the contract versions agree
        run: |
          set -euo pipefail
          # sed rather than `grep -P`: PCRE is not guaranteed present and
          # fails outright under a non-UTF-8 locale.
          app=$(sed -n 's/.*EXPECTED_CONTRACT_VERSION = \([0-9][0-9]*\).*/\1/p' web/app/src/data/schema.ts)
          for file in data/web/v1/*.json; do
            data=$(python -c "import json,sys;print(json.load(open(sys.argv[1],encoding='utf-8'))['header'].get('contract_version',''))" "$file")
            if [ "$data" != "$app" ]; then
              echo "::error file=$file::contract_version $data, app expects $app"
              exit 1
            fi
          done
          echo "contract v$app across $(ls data/web/v1/*.json | wc -l) committed files"

      - run: npx vitest run
        working-directory: web/app

      # §5.12: a project site is served under /<repo>/, and every asset
      # and data URL has to agree with that.
      - name: Build
        working-directory: web/app
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
          # Repo variable (Settings -> Secrets and variables -> Actions ->
          # Variables), not a secret -- it's a public backend URL. Unset
          # until the Squad Optimizer service is actually deployed; empty
          # here makes SquadOptimizer.tsx render its "no backend configured"
          # explanation rather than a broken form (see its module docstring).
          VITE_OPTIMIZER_API_URL: ${{ vars.OPTIMIZER_API_URL }}
        run: npx vite build

      # §5.12: "Parquet artifacts published from the same workflow,
      # versioned alongside the contract." Without them the Graph Builder,
      # Form Matrix and Trend Explorer would show their §5.14.8 empty
      # states on a deployed site that does have the data.
      - uses: actions/download-artifact@v4
        with:
          name: web-parquet
          path: web/app/dist/data/v1

      # A single-page app behind a static host: any deep link has to serve
      # index.html rather than 404. §5.5 makes every view a URL, so this is
      # what keeps a shared link working.
      - run: cp web/app/dist/index.html web/app/dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/app/dist
      - id: deploy
        uses: actions/deploy-pages@v4
