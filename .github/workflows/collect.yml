name: collect

on:
  schedule:
    # Hourly: bootstrap-static + fixtures + element-summary (§2.1, §2.5).
    # Actions cron is best-effort and can drift 5-15 min under load — fine
    # for hourly trend data.
    - cron: "5 * * * *"
    # Price windows: bootstrap-static only, three extra times an hour.
    # 18:xx gives analytics/price_model.py a fresh snapshot just before its
    # 19:00 UTC cycle boundary (with ~4-5 snapshots a day its prediction
    # landed anywhere from 13:00 to 18:30, and its 24h window drifted with
    # it); 22:00-02:59 brackets FPL's nightly change (observed 2026-27:
    # ~22:30-02:00 UTC) tightly. bootstrap is the only endpoint the price
    # model reads, and it takes seconds where element-summary takes ~11
    # minutes.
    - cron: "20,35,50 18,22,23,0,1,2 * * *"
    # There used to be a */5 event-live cron here. It wrote raw payloads to
    # the throwaway runner and never committed or uploaded them
    # (papertrade/actuals.py fetches /event/{gw}/live/ itself after the
    # fact), and 288 scheduled runs a day is the kind of load GitHub
    # throttles — by 2026-10 only ~10 runs a day were firing, about half
    # of them that no-op, so ~4-5 snapshots a day reached the repo.
    # Elite ownership: the top-N managers' picks for the latest deadlined
    # gameweek (collector/top_picks.py). Every 3h; the command is idempotent
    # and no-ops once data/distilled/gw{n}/top_picks.parquet exists, so this
    # just guarantees one successful run soon after each deadline. A full
    # run is ~1000 sequential throttled calls (~17 min).
    - cron: "40 */3 * * *"
  workflow_dispatch: {}

# Prevent overlapping runs from racing on the same Parquet shards / commits.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  hourly:
    if: github.event.schedule == '5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m collector bootstrap
      - run: uv run python -m collector element-summary
      - run: uv run python -m collector prune
      - name: Upload raw payloads (insurance, not permanent — 14-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: data/raw/
          retention-days: 14
          if-no-files-found: warn
      - name: Commit snapshot
        run: |
          git config user.name "fpl-trends-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/reference data/distilled
          git diff --staged --quiet && exit 0
          git commit -m "collector: hourly snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The run takes ~11 minutes, and web.yml, papertrade.yml or a
          # code push often lands on main meanwhile; a bare push was then
          # rejected and the snapshot lost. Shards are timestamp-named, so
          # rebasing onto anyone else's commit never conflicts.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 10))
          done
          exit 1

  prices:
    if: github.event.schedule == '20,35,50 18,22,23,0,1,2 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m collector bootstrap
      - name: Commit snapshot
        run: |
          git config user.name "fpl-trends-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/reference data/distilled
          git diff --staged --quiet && exit 0
          git commit -m "collector: price-window snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 10))
          done
          exit 1

  top-picks:
    if: github.event.schedule == '40 */3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m collector top-picks
      - name: Commit snapshot
        run: |
          git config user.name "fpl-trends-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/distilled
          git diff --staged --quiet && exit 0
          git commit -m "collector: top-picks $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 10))
          done
          exit 1
