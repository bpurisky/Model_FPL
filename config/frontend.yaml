# Frontend export thresholds (§5.2.1, §5.15).
#
# Every value here is a decision that was open in §5.15 and is now closed.
# They live in config rather than in code because the spec says so, and
# because each is the kind of number a reader should be able to check
# against the reasoning without reading Python.

contract_version: 1

normalization:
  # §5.15 Q5. A player must have averaged at least this many minutes per
  # team fixture played to enter the reference population.
  #
  # NOT the proposed flat 450 season-to-date: measured against 2024-25,
  # a flat floor admits *zero* players in any position until gameweek 5,
  # so every normalized surface renders empty for the opening month --
  # exactly when the tool is most used. A floor that scales with fixtures
  # played holds the eligible population between 212 and 224 players from
  # GW1 to GW38 (±3%), which is the property that matters: a z-score in
  # GW3 is then computed against the same kind of reference group as one
  # in GW30, so the scale does not silently change meaning mid-season.
  #
  # 45 = half of a 90-minute fixture. Stricter (60, two-thirds) strangles
  # the population to 134 by GW38 and drops genuine starters who missed a
  # spell; looser (30, a third) lets the group drift toward the marginal.
  minutes_per_fixture_floor: 45

  # Counted per team fixture rather than per gameweek elapsed, so double
  # gameweeks and blanks are fair rather than punitive. The panel already
  # carries n_fixtures.
  basis: within_position_season_to_date

correlations:
  # §5.15 Q1. Below this, a correlation cell is hatched.
  #
  # Deliberately NOT reused as a normalization flag. The same n carries
  # different epistemic weight in the two jobs: a correlation over ~20
  # goalkeepers is a small *sample* with a genuinely wide interval, so
  # hatching states a fact. A z-score over those same 20 is computed
  # against nearly the entire *population* of Premier League keepers --
  # it is not an estimate of anything, and flagging it would spend amber
  # (§5.8.2, reserved for trustworthiness) on a number not in doubt.
  #
  # Consequence, measured against the built file rather than predicted:
  # 92 of 455 cells hatch. They are not spread evenly, and the pattern is
  # the useful part. GK hatches 46 of 91 and FWD hatches 46 of 91; DEF,
  # MID and the pooled group hatch nothing. Every hatched cell involves
  # one of the four metrics that exist only from 2025-26 (tackles,
  # recoveries, CBI, defensive contribution) -- those draw n from a single
  # season, which is 20 keepers and 23 forwards, while the three-season
  # metrics give the same positions 61 and 64.
  #
  # So hatching here marks a *coverage* gap far more often than a
  # small-position gap, and it will keep marking it until those four
  # metrics have a second season behind them. That is true, so it renders.
  min_n_cell: 30

staleness:
  # §5.15 Q3. Collector cadence is hourly (.github/workflows/collect.yml),
  # so anything older than a few cycles means the pipeline has stopped
  # rather than merely lagged.
  warn_after_hours: 6

board:
  # §5.4.6 Q7. The composite is a weighted sum of within-position z-scores,
  # and these are the weights. They live here because the spec says so and
  # because §5.4.6 requires them rendered on screen -- the user must be
  # able to read the model's opinion, not just receive its output.
  #
  # FITTED, not adopted as written. §5.4.6's illustrative profiles name
  # three columns that do not exist: `creativity_p90` (FPL discontinued
  # ICT for 2026-27), `shots_in_box_p90` (in no source this project has),
  # and `minutes_stability` (renamed `minutes_reliability`, since a player
  # who plays exactly 45 minutes every week is stable and useless).
  #
  # Derivation, over 85k player-gameweeks of the archive:
  #   magnitude  = |within-position Spearman of the metric's z-score
  #                 against mean points over the next three gameweeks|
  #   sign       = the registry's own `higher_is_better`
  #   included   = only metrics the registry calls primary or secondary
  #                for that position, with |rho| >= 0.04
  #   normalised = |weights| sum to 1 within each position
  #
  # Two rules there are doing real work. Restricting to primary/secondary
  # keeps goalkeeper tackles (rho -0.097, pure noise) out. Taking the sign
  # from the registry rather than from the data drops `saves_per90` for GK
  # instead of giving it a negative weight: its rho really is -0.076,
  # because saves proxy a leaky defence, but a board that rewarded a
  # goalkeeper for making *fewer* saves would not be modelling goalkeeping.
  #
  # The headline finding is that `minutes_reliability` is the strongest
  # single predictor in every position (rho 0.205-0.250), which is §4.2's
  # "this dominates everything else" showing up again from the other end.
  position_weights:
    GK:
      minutes_reliability: 0.426
      clean_sheet_prob: 0.198
      xgc_per90: -0.171
      goals_conceded_per90: -0.134
      bonus_per90: 0.071
    DEF:
      minutes_reliability: 0.228
      xgc_per90: -0.110
      xgi_per90: 0.099
      xa_per90: 0.095
      clean_sheet_prob: 0.088
      bps_per90: 0.086
      bonus_per90: 0.070
      goals_conceded_per90: -0.062
      cbi_per90: 0.059
      xg_per90: 0.059
      defensive_contribution_per90: 0.044
    MID:
      minutes_reliability: 0.197
      xgi_per90: 0.178
      xg_per90: 0.149
      xa_per90: 0.145
      bps_per90: 0.079
      goals_per90: 0.072
      assists_per90: 0.067
      bonus_per90: 0.059
      clean_sheet_prob: 0.054
    FWD:
      minutes_reliability: 0.247
      goals_per90: 0.134
      xgi_per90: 0.123
      xg_per90: 0.117
      xa_per90: 0.104
      bonus_per90: 0.099
      bps_per90: 0.094
      assists_per90: 0.081

  # Gameweeks of the current season a player needs before the momentum
  # buckets will classify them. Three, because "a consistent rise across
  # three games" needs three observations to be a rise at all.
  trend_window: 3

  # §5.4.6's amber flag: a classification resting on less than this is
  # marked rather than hidden. Same rolling basis as the normalization
  # floor -- see `normalization.minutes_per_fixture_floor`.
  min_gameweeks: 3

  # Share of each position placed in the Optimal bucket and, symmetrically,
  # the size of the ranked shortlist. A quarter is where the measured lift
  # was estimated (+0.671 forward points for the top quartile).
  optimal_quantile: 0.75
